name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wildcat-payroll-github/wildcat-payroll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: wildcat-payroll-github/wildcat-payroll/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WildCat-Payroll.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WildCat-Payroll-APK
          path: wildcat-payroll-github/wildcat-payroll/WildCat-Payroll.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Wild Cat Payroll — build ${{ github.run_number }}
          files: wildcat-payroll-github/wildcat-payroll/WildCat-Payroll.apk
